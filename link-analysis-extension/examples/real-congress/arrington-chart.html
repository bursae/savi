  <style>

    @media (max-width: 760px) {

        flex-direction: column;
      }
      input,
      select {
        min-width: min(320px, calc(100vw - 68px));
      }
    }
  </style>

  <script>
    const chartData = {"title":"Rep. Jodey Arrington - Savi Chart","focusName":"Rep. Jodey Arrington","nodes":[{"id":"u_s_house_of_representatives","label":"U.S. House of Representatives","type":"org","subtitle":"org","focus":false},{"id":"republican_party","label":"Republican Party","type":"org","subtitle":"org","focus":false},{"id":"house_republican_conference","label":"House Republican Conference","type":"org","subtitle":"org","focus":false},{"id":"house_committee_on_energy_and_commerce","label":"House Committee on Energy and Commerce","type":"org","subtitle":"org","focus":false},{"id":"house_committee_on_the_budget","label":"House Committee on the Budget","type":"org","subtitle":"org","focus":false},{"id":"tx_19","label":"TX-19","type":"place","subtitle":"place","focus":false},{"id":"rep_alexandria_ocasio_cortez","label":"Rep. Alexandria Ocasio-Cortez","type":"person","subtitle":"person","focus":false},{"id":"rep_hakeem_jeffries","label":"Rep. Hakeem Jeffries","type":"person","subtitle":"person","focus":false},{"id":"rep_mike_johnson","label":"Rep. Mike Johnson","type":"person","subtitle":"person","focus":false},{"id":"rep_jodey_arrington","label":"Rep. Jodey Arrington","type":"person","subtitle":"person","focus":true},{"id":"h_r_1_reconciliation_pursuant_to_h_con_res_14","label":"H.R.1 - Reconciliation pursuant to H. Con. Res. 14","type":"asset","subtitle":"asset","focus":false},{"id":"public_law_119_21","label":"Public Law 119-21","type":"asset","subtitle":"asset","focus":false},{"id":"event_node_event_61eca9","label":"introduced","type":"event","subtitle":"2025-05-20","focus":false},{"id":"event_node_event_j5prdo","label":"became law","type":"event","subtitle":"2025-07-04","focus":false}],"edges":[{"id":"rel_l11hf8","source":"rep_alexandria_ocasio_cortez","target":"u_s_house_of_representatives","label":"serves in"},{"id":"rel_2k53c3","source":"rep_alexandria_ocasio_cortez","target":"house_committee_on_energy_and_commerce","label":"member of"},{"id":"rel_ud65a3","source":"rep_hakeem_jeffries","target":"u_s_house_of_representatives","label":"serves in"},{"id":"rel_1fi7a9q","source":"rep_hakeem_jeffries","target":"u_s_house_of_representatives","label":"Minority Leader"},{"id":"rel_837m51","source":"rep_mike_johnson","target":"republican_party","label":"member of"},{"id":"rel_1f2tf1z","source":"rep_mike_johnson","target":"u_s_house_of_representatives","label":"serves in"},{"id":"rel_1qz7zfm","source":"rep_mike_johnson","target":"house_republican_conference","label":"member of"},{"id":"rel_d09w6j","source":"rep_mike_johnson","target":"u_s_house_of_representatives","label":"Speaker"},{"id":"rel_16kyeq","source":"rep_jodey_arrington","target":"republican_party","label":"member of"},{"id":"rel_1w9n167","source":"rep_jodey_arrington","target":"tx_19","label":"represents district"},{"id":"rel_107vnvq","source":"rep_jodey_arrington","target":"u_s_house_of_representatives","label":"serves in"},{"id":"rel_1axeejn","source":"rep_jodey_arrington","target":"house_committee_on_the_budget","label":"chairs"},{"id":"rel_eqj9i6","source":"rep_jodey_arrington","target":"h_r_1_reconciliation_pursuant_to_h_con_res_14","label":"sponsored"},{"id":"rel_1lz3a8u","source":"h_r_1_reconciliation_pursuant_to_h_con_res_14","target":"house_committee_on_the_budget","label":"referred to"},{"id":"rel_1jkltq","source":"h_r_1_reconciliation_pursuant_to_h_con_res_14","target":"public_law_119_21","label":"became"},{"id":"rel_1yy4bwg","source":"house_committee_on_energy_and_commerce","target":"u_s_house_of_representatives","label":"committee of"},{"id":"rel_1pv73tn","source":"house_committee_on_the_budget","target":"u_s_house_of_representatives","label":"committee of"},{"id":"rel_kazjfz","source":"house_republican_conference","target":"republican_party","label":"conference of"},{"id":"event_61eca9_rep_jodey_arrington","source":"rep_jodey_arrington","target":"event_node_event_61eca9","label":"participated in"},{"id":"event_61eca9_h_r_1_reconciliation_pursuant_to_h_con_res_14","source":"event_node_event_61eca9","target":"h_r_1_reconciliation_pursuant_to_h_con_res_14","label":"at"},{"id":"event_j5prdo_h_r_1_reconciliation_pursuant_to_h_con_res_14","source":"h_r_1_reconciliation_pursuant_to_h_con_res_14","target":"event_node_event_j5prdo","label":"participated in"},{"id":"event_j5prdo_public_law_119_21","source":"event_node_event_j5prdo","target":"public_law_119_21","label":"at"}]};
    const typeColor = {
      person: "var(--person)",
      org: "var(--org)",
      place: "var(--place)",
      asset: "var(--asset)",
      event: "var(--event)"
    };
    const svg = document.getElementById("chart");
    const tooltip = document.getElementById("tooltip");
    const nodeSelect = document.getElementById("nodeSelect");
    const searchInput = document.getElementById("searchInput");
    const zoomIn = document.getElementById("zoomIn");
    const zoomOut = document.getElementById("zoomOut");
    const resetView = document.getElementById("resetView");
    const width = window.innerWidth;
    const height = window.innerHeight;
    const centerX = width / 2;
    const centerY = height / 2 + 28;
    const nodes = chartData.nodes.map((node, index) => {
      const angle = (index / Math.max(chartData.nodes.length, 1)) * Math.PI * 2;
      const radius = node.focus ? 0 : Math.min(width, height) * (0.2 + (index % 4) * 0.035);
      return {
        ...node,
        x: centerX + Math.cos(angle) * radius,
        y: centerY + Math.sin(angle) * radius,
        vx: 0,
        vy: 0
      };
    });
    const nodeById = new Map(nodes.map((node) => [node.id, node]));
    const edges = chartData.edges
      .map((edge) => ({ ...edge, sourceNode: nodeById.get(edge.source), targetNode: nodeById.get(edge.target) }))
      .filter((edge) => edge.sourceNode && edge.targetNode);

    const defs = make("defs");
    defs.innerHTML = '<marker id="arrow" viewBox="0 0 10 10" refX="17" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4a1"></path></marker>';
    svg.appendChild(defs);
    const viewport = make("g");
    svg.appendChild(viewport);
    const edgeLayer = make("g");
    const labelLayer = make("g");
    const nodeLayer = make("g");
    viewport.append(edgeLayer, labelLayer, nodeLayer);

    for (const node of [...nodes].sort((a, b) => a.label.localeCompare(b.label))) {
      const option = document.createElement("option");
      option.value = node.id;
      option.textContent = node.label;
      nodeSelect.appendChild(option);
    }

    for (const edge of edges) {
      edge.el = make("line", "edge");
      edge.labelEl = make("text", "edge-label");
      edge.labelEl.textContent = edge.label;
      edgeLayer.appendChild(edge.el);
      labelLayer.appendChild(edge.labelEl);
    }

    for (const node of nodes) {
      const group = make("g", "node" + (node.focus ? " focus" : ""));
      group.style.setProperty("--node-color", typeColor[node.type]);
      group.dataset.id = node.id;
      group.dataset.label = node.label;
      group.dataset.subtitle = node.subtitle || node.type;
      group.appendChild(shapeFor(node));
      const label = make("text", "label");
      label.setAttribute("y", "34");
      label.textContent = shortLabel(node.label);
      const subtitle = make("text", "subtitle");
      subtitle.setAttribute("y", "48");
      subtitle.textContent = node.subtitle || node.type;
      group.append(label, subtitle);
      group.addEventListener("pointerenter", showTooltip);
      group.addEventListener("pointermove", moveTooltip);
      group.addEventListener("pointerleave", hideTooltip);
      group.addEventListener("click", (event) => {
        event.stopPropagation();
        selectNode(node.id, true);
      });
      node.el = group;
      nodeLayer.appendChild(group);
    }

    for (let i = 0; i < 380; i += 1) {
      tick();
    }
    render();

    let pan = { x: 0, y: 0 };
    let scale = 1;
    let dragStart = null;
    let selectedNodeId = chartData.focusName ? nodes.find((node) => node.focus)?.id : null;
    svg.addEventListener("pointerdown", (event) => {
      dragStart = { x: event.clientX, y: event.clientY, panX: pan.x, panY: pan.y };
      svg.setPointerCapture(event.pointerId);
    });
    svg.addEventListener("pointermove", (event) => {
      if (!dragStart) return;
      pan = {
        x: dragStart.panX + event.clientX - dragStart.x,
        y: dragStart.panY + event.clientY - dragStart.y
      };
      updateViewport();
    });
    svg.addEventListener("pointerup", () => { dragStart = null; });
    svg.addEventListener("click", () => {
      if (selectedNodeId) {
        selectedNodeId = null;
        nodeSelect.value = "";
        applyFilter();
      }
    });
    svg.addEventListener("wheel", (event) => {
      event.preventDefault();
      zoomAt(event.deltaY > 0 ? 0.92 : 1.08, event.clientX, event.clientY);
    }, { passive: false });
    zoomIn.addEventListener("click", () => zoomAt(1.18, width / 2, height / 2));
    zoomOut.addEventListener("click", () => zoomAt(0.84, width / 2, height / 2));
    resetView.addEventListener("click", () => fitGraph());
    nodeSelect.addEventListener("change", () => {
      if (nodeSelect.value) {
        selectNode(nodeSelect.value, true);
      }
    });
    searchInput.addEventListener("input", () => applyFilter());
    if (selectedNodeId) {
      selectNode(selectedNodeId, false);
    } else {
      fitGraph();
    }

    function tick() {
      for (let i = 0; i < nodes.length; i += 1) {
        for (let j = i + 1; j < nodes.length; j += 1) {
          const a = nodes[i];
          const b = nodes[j];
          const dx = b.x - a.x || 0.01;
          const dy = b.y - a.y || 0.01;
          const distSq = dx * dx + dy * dy;
          const force = Math.min(900 / distSq, 0.9);
          a.vx -= dx * force;
          a.vy -= dy * force;
          b.vx += dx * force;
          b.vy += dy * force;
        }
      }
      for (const edge of edges) {
        const a = edge.sourceNode;
        const b = edge.targetNode;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const target = edge.label.includes("contributed") ? 150 : 125;
        const force = (dist - target) * 0.018;
        const fx = (dx / dist) * force;
        const fy = (dy / dist) * force;
        a.vx += fx;
        a.vy += fy;
        b.vx -= fx;
        b.vy -= fy;
      }
      for (const node of nodes) {
        const pull = node.focus ? 0.08 : 0.012;
        node.vx += (centerX - node.x) * pull;
        node.vy += (centerY - node.y) * pull;
        node.x += node.vx;
        node.y += node.vy;
        node.vx *= 0.72;
        node.vy *= 0.72;
      }
    }

    function render() {
      for (const edge of edges) {
        edge.el.setAttribute("x1", edge.sourceNode.x);
        edge.el.setAttribute("y1", edge.sourceNode.y);
        edge.el.setAttribute("x2", edge.targetNode.x);
        edge.el.setAttribute("y2", edge.targetNode.y);
        edge.labelEl.setAttribute("x", (edge.sourceNode.x + edge.targetNode.x) / 2);
        edge.labelEl.setAttribute("y", (edge.sourceNode.y + edge.targetNode.y) / 2 - 4);
      }
      for (const node of nodes) {
        node.el.setAttribute("transform", "translate(" + node.x + " " + node.y + ")");
      }
      updateViewport();
    }

    function updateViewport() {
      viewport.setAttribute("transform", "translate(" + pan.x + " " + pan.y + ") scale(" + scale + ")");
    }

    function zoomAt(multiplier, clientX, clientY) {
      const nextScale = Math.max(0.28, Math.min(3.5, scale * multiplier));
      const graphX = (clientX - pan.x) / scale;
      const graphY = (clientY - pan.y) / scale;
      pan.x = clientX - graphX * nextScale;
      pan.y = clientY - graphY * nextScale;
      scale = nextScale;
      updateViewport();
    }

    function fitGraph() {
      if (nodes.length === 0) return;
      const margin = 120;
      const minX = Math.min(...nodes.map((node) => node.x));
      const maxX = Math.max(...nodes.map((node) => node.x));
      const minY = Math.min(...nodes.map((node) => node.y));
      const maxY = Math.max(...nodes.map((node) => node.y));
      const graphWidth = Math.max(maxX - minX, 1);
      const graphHeight = Math.max(maxY - minY, 1);
      scale = Math.max(0.28, Math.min(2.2, Math.min((width - margin * 2) / graphWidth, (height - margin * 2) / graphHeight)));
      pan.x = width / 2 - ((minX + maxX) / 2) * scale;
      pan.y = height / 2 - ((minY + maxY) / 2) * scale + 20;
      updateViewport();
    }

    function centerOnNode(nodeId) {
      const node = nodeById.get(nodeId);
      if (!node) return;
      scale = Math.max(scale, 1.15);
      pan.x = width / 2 - node.x * scale;
      pan.y = height / 2 - node.y * scale;
      updateViewport();
    }

    function selectNode(nodeId, shouldCenter) {
      selectedNodeId = nodeId;
      nodeSelect.value = nodeId;
      applyFilter();
      if (shouldCenter) {
        centerOnNode(nodeId);
      }
    }

    function applyFilter() {
      const query = searchInput.value.trim().toLowerCase();
      const selected = selectedNodeId ? nodeById.get(selectedNodeId) : null;
      const connectedIds = new Set();
      if (selected) {
        connectedIds.add(selected.id);
        for (const edge of edges) {
          if (edge.source === selected.id) connectedIds.add(edge.target);
          if (edge.target === selected.id) connectedIds.add(edge.source);
        }
      }
      const matchingIds = new Set();
      if (query) {
        for (const node of nodes) {
          if (node.label.toLowerCase().includes(query) || String(node.subtitle || "").toLowerCase().includes(query)) {
            matchingIds.add(node.id);
          }
        }
        for (const edge of edges) {
          if (edge.label.toLowerCase().includes(query)) {
            matchingIds.add(edge.source);
            matchingIds.add(edge.target);
          }
        }
      }
      for (const node of nodes) {
        const passesSelected = !selected || connectedIds.has(node.id);
        const passesQuery = !query || matchingIds.has(node.id);
        node.el.classList.toggle("hidden", !(passesSelected && passesQuery));
        node.el.classList.toggle("selected", node.id === selectedNodeId);
      }
      for (const edge of edges) {
        const selectedEdge = selected && (edge.source === selected.id || edge.target === selected.id);
        const passesSelected = !selected || selectedEdge;
        const passesQuery = !query || edge.label.toLowerCase().includes(query) || matchingIds.has(edge.source) || matchingIds.has(edge.target);
        edge.el.classList.toggle("hidden", !(passesSelected && passesQuery));
        edge.labelEl.classList.toggle("hidden", !(passesSelected && passesQuery));
        edge.el.classList.toggle("selected", Boolean(selectedEdge));
      }
    }

    function shapeFor(node) {
      if (node.type === "org") {
        const rect = make("rect");
        rect.setAttribute("x", "-23");
        rect.setAttribute("y", "-18");
        rect.setAttribute("width", "46");
        rect.setAttribute("height", "36");
        rect.setAttribute("rx", "7");
        return rect;
      }
      if (node.type === "asset") {
        const path = make("path");
        path.setAttribute("d", "M-16 -22 H11 L21 -12 V22 H-16 Z M11 -22 V-12 H21");
        return path;
      }
      if (node.type === "place") {
        const path = make("path");
        path.setAttribute("d", "M0 -25 C13 -25 22 -15 22 -3 C22 13 0 27 0 27 C0 27 -22 13 -22 -3 C-22 -15 -13 -25 0 -25 Z");
        return path;
      }
      if (node.type === "event") {
        const rect = make("rect");
        rect.setAttribute("x", "-20");
        rect.setAttribute("y", "-20");
        rect.setAttribute("width", "40");
        rect.setAttribute("height", "40");
        rect.setAttribute("rx", "20");
        return rect;
      }
      const circle = make("circle");
      circle.setAttribute("r", node.focus ? "28" : "22");
      return circle;
    }

    function shortLabel(label) {
      return label.length > 28 ? label.slice(0, 25) + "..." : label;
    }

    function showTooltip(event) {
      tooltip.innerHTML = "<strong>" + escapeHtml(event.currentTarget.dataset.label) + "</strong><span>" + escapeHtml(event.currentTarget.dataset.subtitle) + "</span>";
      tooltip.style.opacity = "1";
      moveTooltip(event);
    }

    function moveTooltip(event) {
      tooltip.style.left = event.clientX + "px";
      tooltip.style.top = event.clientY + "px";
    }

    function hideTooltip() {
      tooltip.style.opacity = "0";
    }

    function make(tag, className) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
      if (className) element.setAttribute("class", className);
      return element;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }
  </script>
</body>
</html>
